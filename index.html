function diary(page=0){

 const folio=(n,side)=>n?`<article class="journal-paper ${side}"><div class="journal-micro">${escapeHTML(n.date)} ${n.sample?'／ 架空の表示例':n.published?'／ 掲載確認済みの記録':'／ この端末の試し投稿'}</div><div class="journal-sticker">${escapeHTML(n.sticker||'✎')}</div><h2>${escapeHTML(n.title)}</h2><p>${escapeHTML(n.body)}</p><details class="note-comments"><summary>💬 コメント ${((n.comments||[]).length+(demoComments()[n.id]||[]).length)}件</summary>${[...(n.comments||[]),...(demoComments()[n.id]||[])].map(c=>`<div class="note-reply"><b>${escapeHTML(c.who)}</b><span>${escapeHTML(c.body)}</span></div>`).join('')||'<div class="note-reply">まだコメントはありません。</div>'}<form class="comment-form" data-note="${escapeHTML(n.id)}"><input name="comment" maxlength="160" required placeholder="ひとこと書いてみる（練習）" aria-label="試しコメント"><button type="submit">書く</button></form><div class="comment-caution">コメントはこの端末だけの試作です。外部には届きません。</div></details><div class="journal-foot">✎ HASSEIKEN NOTEBOOK</div></article>`:`<div class="journal-paper blank"><span>次のページは、あなたの一言から。</span></div>`;
 return `<section class="page diary-v3"><div class="diary-cover"><div><span class="eyebrow">HASSEIKEN / THE SHARED NOTEBOOK</span><h1>発生研<br>交換日記<span>。</span></h1><p>大きな発表じゃなくても。小さな出来事、気になったこと、研究室の寄り道を残そう。</p></div><div class="scribble-bird">🐣<small>NOTE № 001</small></div></div>
 <div class="diary-disclaimer">✳ 日記とコメントは、見え方を試すための架空の表示例です。実在のメンバーの発言ではありません。${DATA.diary?.length?"承認された日記は冒頭に掲載しています。":""}</div>
 <div class="journal-book" aria-label="交換日記の見開き">${folio(left,'left')}${folio(right,'right')}</div>
 <div class="journal-controls"><a class="page-turn ${current===0?'disabled':''}" ${current===0?'aria-disabled="true" tabindex="-1"':'href="#diary/page'+(current-1)+'"'}>← 前のページ</a><span>見開き ${current+1} / ${spreadCount}　<small>どのページも手書き風</small></span><a class="page-turn ${current===spreadCount-1?'disabled':''}" ${current===spreadCount-1?'aria-disabled="true" tabindex="-1"':'href="#diary/page'+(current+1)+'"'}>次のページ →</a></div>
 <details class="diary-editor update-box" id="diary-editor"><summary>✎ 自分も一ページ書いてみる（お試し）</summary><p>実名や研究の未発表内容は入力せず、架空の文章で試してください。保存はこの端末のブラウザ内だけです。誰かに共有・公開される機能はありません。</p><form id="diary-form"><label>日付 <input name="date" required maxlength="30" value="2026.11.19"></label><label>見出し <input name="title" required maxlength="90" placeholder="今日の発生研"></label><label>本文 <textarea name="body" required rows="4" maxlength="500" placeholder="小さな発見や今日の出来事を書いてみよう"></textarea></label><fieldset class="sticker-choice"><legend>今日のスタンプ</legend>${['🐣','✳','☕','🌱','🧪','🪶'].map((s,i)=>`<label><input type="radio" name="sticker" value="${s}" ${i===0?'checked':''}><span>${s}</span></label>`).join('')}</fieldset><div class="form-actions"><button type="submit">試しにノートへ貼る ＋</button><button type="button" id="reset-diary">試し投稿をすべて消す</button></div></form></details>
 <div class="diary-policy"><b>新聞との違い</b><p>発生研新聞は正式な研究成果や学会ニュース。交換日記は研究室の日常や個人の視点をゆるく残す場所。更新義務は作らず、公開前には内容を確認します。</p></div></section>${extras()}`;
}

 const form=document.querySelector('#news-form');if(form)form.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(form),entry={date:String(fd.get('date')).trim(),title:String(fd.get('title')).trim(),desc:String(fd.get('desc')).trim(),type:'試し投稿',url:''};if(!entry.title||!entry.date)return;let arr=[];try{const v=JSON.parse(localStorage.getItem('hasseiken_news_demo_v1')||'[]');if(Array.isArray(v))arr=v}catch{};DEMO_POSTS=[entry,...arr].slice(0,12);try{localStorage.setItem('hasseiken_news_demo_v1',JSON.stringify(DEMO_POSTS))}catch{};location.hash='news/draft';render()});
 const reset=document.querySelector('#reset-local');if(reset)reset.addEventListener('click',()=>{DEMO_POSTS=[];try{localStorage.removeItem('hasseiken_news_demo_v1')}catch{};location.hash='news/draft';render()});
 document.querySelectorAll('input[data-local-preview]').forEach(inp=>inp.addEventListener('change',()=>{const file=inp.files&&inp.files[0];if(!file||!file.type.startsWith('image/'))return;const target=document.getElementById(inp.dataset.localPreview);if(!target)return;if(target.dataset.blobUrl)URL.revokeObjectURL(target.dataset.blobUrl);const url=URL.createObjectURL(file);target.src=url;target.dataset.blobUrl=url;target.style.display='block';const drawing=target.parentElement.querySelector('.slot-illustration');if(drawing)drawing.style.display='none';}));
 let filter=document.querySelector('#paper-filter');if(filter)filter.addEventListener('input',e=>{let q=e.target.value.toLowerCase().trim();let shown=0;document.querySelectorAll('.paper-card').forEach(c=>{const match=c.dataset.paper.includes(q);c.hidden=!match;shown+=Number(match)});document.querySelector('#paper-none').classList.toggle('hidden',shown!==0)});
}
window.addEventListener('hashchange',render);render();
</script></body></html>
